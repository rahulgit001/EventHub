name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run backend tests
        run: pytest backend/tests -q

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose and build images
        env:
          POSTGRES_DB: eventhub
          POSTGRES_USER: eventhub
          POSTGRES_PASSWORD: ci-database-password-123456
          SECRET_KEY: ci-only-jwt-secret-key-long-enough-for-validation
          BOOTSTRAP_ADMIN_EMAIL: admin@example.test
          BOOTSTRAP_ADMIN_PASSWORD: ci-admin-password-123456
          DEMO_CUSTOMER_EMAIL: customer@example.test
          DEMO_CUSTOMER_PASSWORD: ci-customer-password-123456
          CORS_ORIGINS: http://localhost:5173
          VITE_API_BASE_URL: http://localhost:8000/api
        run: |
          docker compose config --quiet
          docker compose build